<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>September 11, 2001 — Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="boot"><div class="boot-inner"><div class="spinner"></div><p>Loading state geometry…</p></div></div>

<header id="topbar">
  <div class="brand">
    <span id="flag90" class="flag90" role="img" aria-label="Animated United States flag"></span>
    <div class="brand-text">
      <h1>September 11, 2001</h1>
      <span class="sub">Flight tracker &amp; claim tester</span>
    </div>
  </div>

  <div class="clock-wrap">
    <div id="clock">07:55:00</div>
    <div class="clock-label">Eastern Daylight Time</div>
  </div>

  <div class="transport">
    <button id="btn-play" class="icon-btn" title="Play / pause (space)"><span id="play-glyph">▶</span></button>
    <div class="rate-group" id="rate-group">
      <button data-rate="1">1×</button>
      <button data-rate="15" class="on">15×</button>
      <button data-rate="60">60×</button>
      <button data-rate="240">240×</button>
    </div>
    <button id="btn-follow" class="ghost-btn on" aria-pressed="true"
            title="Keep the camera on whatever is airborne (F)">Follow</button>
    <button id="btn-reset-view" class="ghost-btn" title="Stop following and show the whole country">Reset view</button>
    <button id="btn-map" class="ghost-btn only-mobile" title="Swap between the map and the reading">Map</button>
    <button id="btn-tour" class="tour-btn" title="Play a guided walk through the steelman argument">
      <span class="tour-btn-glyph">&#9654;</span> Steelman tour
    </button>
  </div>
</header>

<main id="stage">
  <canvas id="map"></canvas>
  <div id="labels"></div>

  <div id="hud">
    <div id="hud-state">—</div>
    <div id="hud-hint">drag to pan · right-drag, shift-drag or ctrl-drag to rotate · scroll to zoom · click to inspect</div>
  </div>

  <div id="legend">
    <div class="legend-title">Vertical scale</div>
    <div class="alt-group" id="alt-group">
      <button data-alt="1" class="on">1× true</button>
      <button data-alt="2">2×</button>
      <button data-alt="5">5×</button>
    </div>
    <div class="legend-row" id="alt-note"></div>
  </div>

  <button id="aside-toggle" title="Show / hide panel">›</button>

  <!-- One popover, shared by every (i) on the page. -->
  <div id="info-pop" class="hidden" role="dialog" aria-label="Definition">
    <div class="ip-term" id="ip-term"></div>
    <p class="ip-plain" id="ip-plain"></p>
    <p class="ip-more" id="ip-more"></p>
    <div class="ip-src" id="ip-src"></div>
  </div>

  <!-- The guided tour's callout. Lives over the map, because the map is what
       it is talking about. -->
  <section id="tour" class="hidden" aria-live="polite" aria-label="Steelman tour">
    <div class="tour-bar"><i id="tour-bar-fill"></i></div>
    <div class="tour-head">
      <span id="tour-chapter" class="tour-chapter">&mdash;</span>
      <span id="tour-count" class="tour-count"></span>
      <button id="tour-close" class="tour-x" title="End the tour (Esc)">&#10005;</button>
    </div>
    <h4 id="tour-title"></h4>
    <div id="tour-body"></div>
    <div class="tour-foot">
      <div id="tour-dots" class="tour-dots"></div>
      <div class="tour-ctl">
        <button id="tour-prev" title="Previous step (&larr;)">&lsaquo;</button>
        <button id="tour-replay" title="Show me where to look again">&#9673;</button>
        <button id="tour-next" title="Next step (space or &rarr;)">&rsaquo;</button>
      </div>
    </div>
  </section>
</main>

<aside id="panel">
  <nav id="tabs">
    <button data-tab="brief" class="on">Start&nbsp;here</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="critic">CRITIC</button>
    <button data-tab="aware">Who&nbsp;knew</button>
    <button data-tab="claim">Claim</button>
    <button data-tab="debris">Flight&nbsp;93</button>
    <button data-tab="military">Military</button>
    <button data-tab="conflicts">Conflicts<span id="conflict-count"></span></button>
    <button data-tab="layers">Layers</button>
  </nav>

  <section class="tab-body" data-body="brief" id="brief-body"></section>

  <section class="tab-body hidden" data-body="aware" id="aware-body"></section>

  <section class="tab-body hidden" data-body="timeline">
    <div id="now-card" class="card"></div>
    <div id="event-list"></div>
  </section>

  <section class="tab-body hidden" data-body="critic"><div id="critic-body"></div></section>
  <section class="tab-body hidden" data-body="claim"><div id="claim-body"></div></section>
  <section class="tab-body hidden" data-body="debris"><div id="debris-body"></div></section>
  <section class="tab-body hidden" data-body="military"><div id="military-body"></div></section>
  <section class="tab-body hidden" data-body="conflicts"><div id="conflicts-body"></div></section>
  <section class="tab-body hidden" data-body="layers"><div id="layers-body"></div></section>
</aside>

<footer id="timeline">
  <div id="track-wrap">
    <div id="ticks"></div>
    <div id="track">
      <div id="track-fill"></div>
      <div id="event-marks"></div>
      <div id="playhead"><div class="playhead-grip"></div></div>
    </div>
    <input id="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Scrub timeline" />
  </div>
  <div id="flight-strip"></div>
</footer>

<div id="tooltip" class="hidden"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
